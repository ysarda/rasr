# RASR Configuration
# Simple, centralized configuration file

# Directories
data_dir: "data"
falls_dir: "falls"
vis_dir: "vis"
links_dir: "links"
archive_dir: "archive"

# Processing
max_workers: null  # null = auto-detect CPU count
batch_size: 160  # files per batch
confidence_threshold: 0.75
visualization: true

# Data Collection
time_range:
  start: 0  # HHMMSS format
  end: 235959
download_retries: 5
concurrent_downloads: 6  # Number of parallel download threads per site (boto3)

# Model
model_path: "RASRmodl.pth"
model_classes: ["fall"]

# Legacy NOAA Settings (deprecated - now using direct S3 access)
noaa_base_url: "https://www.ncdc.noaa.gov/nexradinv/bdp-download.jsp"
radar_product: "AAL2"  # Level II data

