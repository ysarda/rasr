# Notes:
# - time_start_utc and time_end_utc define the data collection window
# - Typically set to ±30-90 minutes around the event time
# - radar_stations can be manually specified or auto-detected based on location
# - radar_details provide specific sweep information for validation
# - Events marked as satellite de-orbits or debris re-entries should be used cautiously
#   as they have different characteristics than natural meteorite falls
