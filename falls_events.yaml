# Confirmed Meteorite Fall Events for RASR Data Collection
# Source: NASA ARES Meteorite Falls Database
# URL: https://ares.jsc.nasa.gov/meteorite-falls/events/
#
# This file contains confirmed meteorite falls detected by NEXRAD radar.
# Each event includes the necessary parameters to download radar data from AWS S3.
#
# Fields:
#   name: Event identifier
#   date: Date in YYYY-MM-DD format
#   time_start_utc: Start time for data collection window (HH:MM:SS)
#   time_end_utc: End time for data collection window (HH:MM:SS)
#   location: Geographic coordinates
#   radar_stations: List of NEXRAD stations that detected the event
#   notes: Description and additional details
#   source_url: Link to NASA ARES event page

events:
  # 2025 Events
  - name: "Pebble AL"
    date: "2025-11-06"
    time_start_utc: "06:00:00"
    time_end_utc: "07:30:00"
    location:
      latitude: 34.353008
      longitude: -87.53902
    radar_stations:
      - KGWX
    radar_details:
      - station: KGWX
        sweep_time: "06:34:00"
        sweep_angle: 4.48
        altitude_km: 7.1
    notes: "Steeply inclined meteor (82° below horizontal) that survived to <14km altitude. Single radar signature detected 137s after bolide. Estimated 1g mass. Orbital path entirely within Mars' orbit."
    source_url: "https://ares.jsc.nasa.gov/meteorite-falls/events/pebble-al"

  - name: "Gateway AR"
    date: "2025-08-17"
    time_start_utc: "01:00:00"
    time_end_utc: "02:30:00"
    location:
      latitude: 36.470542
      longitude: -93.901816
    radar_stations:
      - KEAX
    radar_details:
      - station: KEAX
        sweep_time: "01:34:00"
    notes: "Flat-trajectory, long-lasting fireball over northern Arkansas. Small radar signature detected. Ground track azimuth 300° (NW). AMS Event #4996 of 2025."
    source_url: "https://ares.jsc.nasa.gov/meteorite-falls/events/gateway-ar"

  - name: "McDonough GA"
    date: "2025-06-26"
    time_start_utc: "16:00:00"
    time_end_utc: "17:30:00"
    location:
      latitude: 33.395741
      longitude: -84.204474
    radar_stations:
      - KFFC  # Primary NEXRAD for Atlanta area
      # Seven other NEXRAD radars also detected this event
      # Plus Atlanta Hartsfield TDWR
    notes: "Very bright daytime bolide (superbolide) south of Atlanta. Detected by 8 radars (7 NEXRAD + 1 TDWR). ~1m diameter object at 13 km/s. Strong westward winds (~150 mph) created wide strewn field. Multiple meteorite recoveries. Originally named Blacksville."
    source_url: "https://ares.jsc.nasa.gov/meteorite-falls/events/mcdonough-ga"

