    notes: "Bright nighttime bolide west of Indianapolis. Massive fall with many stones (1g to 670g). Steep infall angle, north-south trajectory. High altitude winds up to 63 m/s (142 mph). AMS Event #7647 of 2024. Provisional name."
    source_url: "https://ares.jsc.nasa.gov/meteorite-falls/events/amo-in"

  - name: "Pontiac KS"
    date: "2024-12-02"
    time_start_utc: "18:45:00"
    time_end_utc: "20:00:00"
