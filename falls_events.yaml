    notes: "Long-lasting daytime fireball near Wichita. Detected by 4 NEXRAD radars plus GLM satellites. Meteorites 1-133g. ~23km strewn field. Extreme winds >100 mph at 13km altitude. First identified by citizen scientist Eric Rasmussen."
    source_url: "https://ares.jsc.nasa.gov/meteorite-falls/events/pontiac-ks"

  # 2018 Events - Well-documented cases
  - name: "Hamburg MI"
    date: "2018-01-17"
    time_start_utc: "01:00:00"
    time_end_utc: "02:00:00"
    location:
      latitude: 42.441864
      longitude: -83.820635
    radar_stations:
      - KDTX  # Detroit area
      # Plus Detroit airport TDWR
    radar_details:
      - station: KDTX
        sweep_time: "01:07:00"
        first_signature: "01:13:03"
        altitude_m: 2234
        final_signature: "01:40:58"
    notes: "Bright fireball over Detroit area, traveling E-W. H4 chondrite. Meteorite signatures detected across 7 radar sweeps. Sonic booms on seismometers. Fragmentation at ~20km altitude. AMS Event #168 of 2018."
    source_url: "https://ares.jsc.nasa.gov/meteorite-falls/events/hamburg-michigan"

  - name: "Pacific Coast WA"
    date: "2018-03-08"
    time_start_utc: "03:00:00"
    time_end_utc: "03:30:00"
    location:
      latitude: 47.4312
      longitude: -124.3448
    radar_stations:
      - KRTX  # Portland, OR
      - KLGX  # Langley Hill, WA
      - KATX  # Seattle, WA
    radar_details:
      - station: KRTX
        sweep_time: "03:05:26"
        altitude_m: 19750
      - final_detection: "03:15:42"  # All three radars
    notes: "Most massive fireball seen in weather radar to date. ~31x Park Forest IL mass. Western Olympic peninsula. 10 minutes of radar detection (03:05-03:15). Fell into ocean. 22 eyewitnesses, 4 sonic boom reports. Seafloor search conducted."
    source_url: "https://ares.jsc.nasa.gov/meteorite-falls/events/pacific-coast-washington"

