    notes: "Large nighttime fall south of Chicago (~18 kg recovered, fragments struck homes). Detected by 6 NEXRAD radars across 12 sweeps, 05:50-05:58 UTC; first detection KMKX 4.2deg at 15.5 km altitude. Classic well-documented radar-detected fall, but PRE-DUAL-POL (2003): no rho_hv or differential_reflectivity."
