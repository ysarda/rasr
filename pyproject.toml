[project]
name = "rasr"
version = "0.0.1"
description = "Re-entry Analysis of Serendipitous Radar data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Yash Sarda", email = "ysarda9@gmail.com" },
]

dependencies = [
    "arm-pyart",
    "beautifulsoup4",
    "boto3",
    "botocore",
    "geojson",
    "matplotlib",
    "netcdf4",
    "numpy",
    "pillow",
    "pymap3d",
    "pyyaml",
    "requests",
    "scikit-learn",
    "scipy",
    "torch",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rasr"]
